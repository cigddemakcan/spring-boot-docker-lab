services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpass123
      POSTGRES_DB: labdb
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/labdb
      DB_PASSWORD: labpass123
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine

volumes:
  postgres-data: